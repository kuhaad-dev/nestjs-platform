name: Build and Deploy to GKE

# Trigger: only on pushes to master branch
on:
  push:
    branches: [ "master" ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: us-central1
  REPOSITORY: nestjs-app
  IMAGE: nest-app
  GKE_CLUSTER: nestjs-cluster
  GKE_ZONE: us-central1-a

jobs:
  # ─── Job 1: Run Tests ───────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --passWithNoTests
        # --passWithNoTests: pipeline won't fail if you have no tests yet
        # Remove this flag once you write real tests

  # ─── Job 2: Build and Push Docker Image ─────────────────────────
  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: test   # only runs if test job passes
    
    # These permissions are required for Workload Identity Federation
    permissions:
      contents: read
      id-token: write   # allows GitHub to generate OIDC token for GCP auth

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest \
            .
        # Tags with git SHA (immutable, traceable) AND latest (convenient)
        # In production: only SHA tag. latest is ambiguous.

      - name: Push Docker image
        run: |
          docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest

      - name: Output image name
        id: image
        run: |
          echo "image=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}" >> $GITHUB_OUTPUT

  # ─── Job 3: Deploy to GKE ───────────────────────────────────────
  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: build   # only runs if build job passes

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/

      - name: Update deployment image
        run: |
          kubectl set image deployment/nest-app \
            nest-app=${{ needs.build.outputs.image }}
        # Sets the exact SHA-tagged image on the deployment
        # Triggers a rolling update automatically

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/nest-app --timeout=120s
        # Blocks until all pods are running the new image
        # If pods crash: this fails, pipeline fails, you get notified
        # Old pods kept running until new ones are healthy

      - name: Verify deployment
        run: |
          kubectl get pods
          echo "Deployment successful"