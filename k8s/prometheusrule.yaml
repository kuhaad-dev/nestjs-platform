apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nest-app-alerts
  namespace: monitoring
  labels:
    release: monitoring    # must match Helm release name so Prometheus picks it up
spec:
  groups:
    - name: nest-app.rules
      interval: 30s
      rules:

        # Alert 1: App is receiving no traffic
        # Fires if http_requests_total rate is 0 for 2 minutes
        - alert: NestAppNoTraffic
          expr: sum(rate(http_requests_total{job="nest-app-service"}[2m])) == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "NestJS app receiving no traffic"
            description: "No HTTP requests received in the last 2 minutes. App may be down."

        # Alert 2: High p99 latency
        # Fires if 99th percentile latency exceeds 500ms
        - alert: NestAppHighLatency
          expr: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{job="nest-app-service"}[5m])) by (le)) > 0.5
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "NestJS app high latency"
            description: "p99 latency is above 500ms for the last 1 minute."

        # Alert 3: Pod not ready
        # Fires if any nest-app pod is not ready
        - alert: NestAppPodNotReady
          expr: kube_pod_status_ready{namespace="default",pod=~"nest-app-.*",condition="true"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "NestJS pod not ready"
            description: "A nest-app pod has been not ready for 1 minute."