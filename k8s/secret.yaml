apiVersion: v1
kind: Secret
metadata:
  name: nest-app-secrets
  namespace: default
type: Opaque
# IMPORTANT: K8s Secrets are base64-encoded, NOT encrypted.
# Anyone with kubectl access can decode them with: echo "value" | base64 -d
# In production you'll replace this with Sealed Secrets or GCP Secret Manager.
# For now, understand the limitation.
#
# To generate these values:
# echo -n "your-value" | base64
stringData:
  # stringData lets you write plain text — K8s encodes it automatically.
  # Use this in dev. In CI/CD you'll generate the encoded 'data:' block.
  DB_PASSWORD: "app_password"
  DB_HOST: "nest-mysql-service"   # ← This will be your MySQL Service name
  JWT_ACCESS_SECRET: "super-secret-access-change-me-min-32-chars"
  JWT_REFRESH_SECRET: "super-secret-refresh-change-me-min-32-chars"