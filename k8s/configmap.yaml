apiVersion: v1
kind: ConfigMap
metadata:
  name: nest-app-config
  # Namespace = logical isolation within a cluster.
  # 'default' is fine for now. In production you'd use 'production' or your app name.
  namespace: default
data:
  # Non-sensitive config only. These become environment variables in your pod.
  # Notice: no DB_HOST here yet — in K8s, that will be a Service name.
  NODE_ENV: "production"
  PORT: "3000"
  DB_PORT: "3306"
  DB_NAME: "app_db"
  DB_USER: "app_user"
  JWT_ACCESS_TTL: "15m"
  JWT_REFRESH_TTL: "7d"
  CORS_ORIGIN: "http://localhost:3001"
  SWAGGER_ENABLED: "true"