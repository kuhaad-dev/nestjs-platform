apiVersion: v1
kind: Service
metadata:
  name: nest-app-service
  namespace: default
  labels:
    app: nest-app          # ← add this label
spec:
  type: ClusterIP
  selector:
    app: nest-app
  ports:
    - name: http           # ← add port name
      protocol: TCP
      port: 80
      targetPort: 3000