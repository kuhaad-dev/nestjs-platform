apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: default
spec:
  replicas: 1       # Never run 2 replicas of a stateful DB without proper clustering
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              value: "app_db"
            - name: MYSQL_USER
              value: "app_user"
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secrets
                  key: MYSQL_PASSWORD
          args:
            - "--default-authentication-plugin=mysql_native_password"
          # Readiness probe: pod won't receive traffic until MySQL is actually ready
          # This is the Kubernetes equivalent of your docker-compose healthcheck
          readinessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - "-h"
                - "localhost"
                - "-u"
                - "root"
                - "-prootpassword"
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-storage
          # emptyDir = wiped when pod is deleted. Fine for dev/learning.
          # In production this becomes a PersistentVolumeClaim (PVC).
          # You'll upgrade this when we do the full production setup.
          emptyDir: {}
---
# This Service is why 'nest-mysql-service' resolves in your app.
# CoreDNS registers this name. Any pod in the cluster can reach
# MySQL at nest-mysql-service:3306 — no IPs needed.
apiVersion: v1
kind: Service
metadata:
  name: nest-mysql-service    # ← Must match DB_HOST in your secret exactly
  namespace: default
spec:
  type: ClusterIP             # Internal only — never exposed outside cluster
  selector:
    app: mysql                # Routes to pods with this label
  ports:
    - port: 3306
      targetPort: 3306